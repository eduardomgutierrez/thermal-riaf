[run]
output_dir = "runs/thermal-riaf"
omp_threads = 4

[profile]
# Use "hydro" for the bundled 1-D solver. Use "external" to read a radial
# profile produced by another code; see docs/external-profiles.md.
source = "hydro"

[hydro]
# Mass in solar masses and outer accretion rate in Eddington units.
blackHoleMass = 6.5e9
accRateNorm = 0.00042
# Radii use Schwarzschild units R_S = 2GM/c^2.
rOut = 1.0e4
innerRadiusSSD = 9.0e3
# Gas/total pressure, viscosity, direct electron heating, and wind indices.
beta = 0.9
alpha = 0.1
delta = 0.3
s = 0.35
pIndex = 0.1
# Bracket in log10 of the dimensionless inner angular momentum. The solver
# finds the value inside this interval that crosses the sonic point smoothly.
log10j0 = 0.084397553
log10j1 = 0.322219295

[radiation]
synchrotron = true
bremsstrahlung = true
comptonization = true
calculate_scattering_matrix = true
# Fixed seed makes the Monte Carlo scattering matrix reproducible and
# independent of OpenMP thread count.
scattering_random_seed = 5489

[grid]
# Photon energy limits are log10(E/eV).
radius_samples = 50
energy_samples = 100
log10_energy_ev_min = -6.0
log10_energy_ev_max = 8.0
